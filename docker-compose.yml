services:
  kpital-postgres:
    image: postgres:16-alpine
    container_name: kpital-postgres
    environment:
      POSTGRES_USER: kpital
      POSTGRES_PASSWORD: kpital
      POSTGRES_DB: kpital
    ports:
      - "5544:5432"
    volumes:
      - kpital_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpital -d kpital"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kpital_pgdata:
