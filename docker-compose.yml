services:
  kpital-postgres:
    image: postgres:16-alpine
    container_name: kpital-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kpital
      POSTGRES_PASSWORD: kpital
      POSTGRES_DB: kpital
    ports:
      - "5544:5432"
    volumes:
      - kpital_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpital -d kpital"]
      interval: 5s
      timeout: 3s
      retries: 10

  kpital-minio:
    image: minio/minio
    container_name: kpital-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kpital
      MINIO_ROOT_PASSWORD: kpital-secret
    ports: ["9100:9000", "9101:9001"]
    volumes: ["kpital_miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kpital_pgdata:
  kpital_miniodata:
